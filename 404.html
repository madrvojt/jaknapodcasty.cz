<!DOCTYPE html>
<html lang="cs-CZ">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stránka nenalezena – Jak na podcasty</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #f5f4fa;
      color: #3f3a6b;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .wrap { max-width: 480px; }
    .icon { font-size: 4rem; margin-bottom: 1rem; }
    h1 { font-size: 2rem; font-weight: 700; margin-bottom: .75rem; }
    p { color: #6B7280; line-height: 1.6; margin-bottom: 2rem; }
    a {
      display: inline-block;
      background: #7267c2;
      color: #fff;
      text-decoration: none;
      padding: .75rem 2rem;
      border-radius: 12px;
      font-weight: 600;
    }
    a:hover { background: #5c52a8; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="icon">🎙️</div>
    <h1>Stránka nenalezena</h1>
    <p>Tato stránka neexistuje nebo byla přesunuta.<br>Vrať se na úvodní stránku a pokračuj.</p>
    <a href="/">Zpět na úvod</a>
  </div>
</body>
</html>
